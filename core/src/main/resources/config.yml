# Thanks for using TwiAntiVpn, the free connection security plugin with premium quality.
# There is a lot to configure, if you want to. If not, you don't have to!
# If you leave it as default, TwiAntiVpn will use ProxyCheck (https://proxycheck.io/)
# to check for vpn or proxy usage and block connections from those. For geo data, TwiAntiVpn
# will use the IP-API (https://ip-api.com/) service.

# Message config used for all messages send to the player.
# You can add your own languages by creating a file called <language>.yml and setting the
# entry below to the file name without the .yml extension.
message-language: en

security:
  # Repeated blocks from the same IP are still denied, but staff notifications,
  # webhooks and console commands are emitted at most once per action type in this window.
  action-cooldown-seconds: 5

# Settings about how to behave when finding a vpn or geo-blocked user.
behavior:
  username:
    # If set to true, usernames containing any entry under username-filter.blocked-contains are blocked before VPN/API checks.
    kick-player: true
    notify-staff: true
    execute-command:
      enabled: false
      command: kick %NAME% Forbidden username
    send-webhook:
      enabled: false
      url: ''
  isp:
    # If set to true, players connecting through a blocked ASN/ISP cannot join the server.
    kick-player: true
    notify-staff: true
    execute-command:
      enabled: false
      command: ban-ip %IP%
    send-webhook:
      enabled: false
      url: ''
  vpn:
    # If set to true, players connected to a vpn cannot join the server.
    kick-player: true
    # If set to true, players with the permission twiantivpn.notify.vpn will receive a notification message
    # when a player connected to a vpn tries to connect.
    notify-staff: true
    # If set to true, the specified command will be executed by the console when a user connected to a vpn tries to connect.
    # Available placeholders: %NAME%, %IP%
    execute-command:
      enabled: false
      command: ban-ip %IP%
    # If set to true, a discord webhook message is sent.
    send-webhook:
      enabled: false
      url: ''

    # If you want some players or ip addresses to be exempted from the vpn check,
    # you can add them here.
    exemptions:
      - 069a79f4-44e9-4726-a5be-fca90e38aaf5
      - 127.0.0.1
    # If enabled, players with the permission twiantivpn.exemption.vpn will not be flagged as vpn players.
    # Only available when having LuckPerms installed.
    use-permission-exemption: false
  geo:
    # If set to true, geo-blocked players cannot join the server.
    kick-player: true
    # If set to true, players with the permission twiantivpn.notify.geo will receive a notification message
    # when a geo-blocked player tries to connect.
    notify-staff: true
    # If set to true, the specified command will be executed by the console when a geo-blocked user tries to connect.
    # Available placeholders: %NAME%, %IP%
    execute-command:
      enabled: false
      command: ban-ip %IP%
    # If set to true, a discord webhook message is sent.
    send-webhook:
      enabled: false
      url: ''

    # Define how restrictive you want to be with geo-blocking.
    # Available options:
    # - BLACKLIST (action specified by 'flag' below will be executed, if the country is on the list)
    # - WHITELIST (action specified by 'flag' below will be executed, if the country is not on the list)
    type: BLACKLIST

    # Countries are specified by their Alpha 2 code.
    # A full list can be found here: https://www.iban.com/country-codes
    list:
      - CN
      - RU
    # If you want some players or ip addresses to be exempted from the geo check,
    # you can add them here.
    exemptions:
      - 069a79f4-44e9-4726-a5be-fca90e38aaf5
      - 127.0.0.1
    # If enabled, players with the permission twiantivpn.exemption.geo will not be flagged as geo-blocked players.
    # Only available when having LuckPerms.
    use-permission-exemption: false

# You can use multiple services at the same time (just enable multiple at once) to minimize
# the possibility of a false-flag (high value) or catch very niche vpn services (low value). This number determines, how many of the enabled services have
# to report that an ip is a proxy/vpn, before the plugin will treat it as a proxy/vpn.
# Default value: 1
required-positive-flags: 1

# Controls whether TwiAntiVpn checks run before or after anti-bot plugins that listen to login events.
# Available options:
# - BEFORE_ANTIBOT: default; run at the earliest supported event priority.
#   If Sonar is installed, TwiAntiVpn also hooks Sonar's verification join event and disconnects VPN/proxy hits early.
# - AFTER_ANTIBOT: run late and skip VPN/API work if another plugin already denied the login.
login-check:
  order: BEFORE_ANTIBOT
  adaptive-sonar:
    # Only applies when order is BEFORE_ANTIBOT and Sonar is installed.
    # Sonar remains first while its own attack tracker reports an active attack.
    # TwiAntiVpn resumes early VPN checks after Sonar mitigates the attack and
    # the recovery window below has elapsed without another attack signal.
    enabled: true
    # Clamped between 5 and 600 seconds. Default: 30.
    recovery-delay-seconds: 30
    # During normal traffic, enabled entries run from Sonar's verification hook.
    # Remaining enabled modules run after Sonar. During an attack and recovery,
    # every module is moved after Sonar regardless of these values.
    before-sonar:
      username-filter: false
      proxy-blocklist: true
      vpn-providers:
        proxycheck: false
        ip-api: false
        iphub: false
        vpnapi: false
        custom: false
      geo-block: false
      isp-block: false

# Username filter is checked before VPN/cache/API lookups. Matching is case-insensitive and uses "contains".
username-filter:
  enabled: false
  blocked-contains:
    - bot
    - proxy

asteroid-proxy:
  # When Asteroid/AsteroidProxy/AsteroidSpoofer is installed, verified Asteroid fake players skip VPN/geo/ISP checks.
  # The bypass is only applied when Asteroid's fake-player registry confirms the UUID.
  enabled: true
  plugin-names:
    - Asteroid
    - AsteroidProxy
    - AsteroidSpoofer
    - AsteroidLibs

# Proxy/IP blocklists are checked before cached API results and before any external VPN provider call.
# Supported entries in downloaded IP list files: plain IPs, ip:port lines and CIDR ranges.
# Common .txt, .ipset, .lst, .netset and extensionless list URLs are all accepted.
# The parser scans whitespace/comma separated tokens, so ipset/netset-style lines such as "add list 1.2.3.0/24" work too.
proxy-blocklist:
  enabled: true
  # How often remote proxy/IP lists are refreshed. Unit: minutes.
  refresh-interval: 60
  # Safety limits to avoid excessive memory use when a remote list is malformed or unexpectedly huge.
  # Default is 3000000. You may raise it for very large lists, but it is capped at 15000000 internally.
  # refresh-interval is clamped between 5 and 1440 minutes to prevent accidental or malicious refresh storms.
  max-entries: 3000000
  max-line-length: 512
  request-timeout-seconds: 15
  # Delay between sources keeps refresh traffic controlled. Clamped to 100-5000 ms.
  source-delay-millis: 250
  urls:
    - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt
    - https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt
    - https://raw.githubusercontent.com/scriptzteam/ProtonVPN-VPN-IPs/main/exit_ips.txt
    - https://check.torproject.org/torbulkexitlist?ip=1.1.1.1
    - https://cinsscore.com/list/ci-badguys.txt
    - https://lists.blocklist.de/lists/all.txt
    - https://raw.githubusercontent.com/vakhov/fresh-proxy-list/refs/heads/master/socks4.txt
    - https://blocklist.greensnow.co/greensnow.txt
    - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/stopforumspam_7d.ipset
    - https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies.txt
    - https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks4.txt
    - https://github.com/FifzzSENZE/Master-Proxy/raw/refs/heads/master/proxies/all.txt
    - https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt
    - https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt
    - https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/all.txt
    - https://raw.githubusercontent.com/roosterkid/openproxylist/main/HTTPS_RAW.txt
    - https://raw.githubusercontent.com/roosterkid/openproxylist/main/SOCKS4_RAW.txt
    - https://raw.githubusercontent.com/roosterkid/openproxylist/main/SOCKS5_RAW.txt
    - https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/http.txt
    - https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/https.txt
    - https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/socks4.txt
    - https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/socks5.txt
    - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt
    - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt
    - https://raw.githubusercontent.com/vakhov/fresh-proxy-list/master/http.txt
    - https://raw.githubusercontent.com/vakhov/fresh-proxy-list/master/https.txt
    - https://raw.githubusercontent.com/vakhov/fresh-proxy-list/master/socks5.txt
    - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/tor_exits.ipset
    - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset
    - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level2.netset
