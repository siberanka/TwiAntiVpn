# TwiAntiVpn language file.
# {prefix}, {kick_prefix}, and {kick_contact} are resolved from their messages entries.
command:
  no-permission: "{prefix} &cYou do not have permission to use this command."
  unknown-subcommand: "{prefix} &7Unknown subcommand. Use &f/twiantivpn help&7 to view available commands."
  config-reload: "{prefix} &aConfiguration and language files reloaded."
  clear:
    clear-all: "{prefix} &7All VPN and geo cache entries were cleared."
    clear-specific: "{prefix} &7Cache entries for &f%ENTRY%&7 were cleared."
  whitelist:
    added: "{prefix} &f%IP% &7was added to the temporary whitelist until the server restarts."
    already-added: "{prefix} &f%IP% &7is already on the temporary whitelist."
    invalid-ip: "{prefix} &7Enter a valid IPv4 or IPv6 address."
  invalid-argument: "{prefix} &7Enter an online player, UUID, or valid IP address."
  test:
    busy: "{prefix} &eA connection test is already running. Wait for it to finish."
    failed: "{prefix} &cThe connection test failed safely. Review error.log for details."
    attack-status: "{prefix} &7Routing mode: &f%MODE% &8| &7Before: &f%BEFORE% &8| &7After: &f%AFTER%"
    sonar-first: "Sonar first"
    antivpn-first: "TwiAntiVpn first"
    connection-result: "{prefix} &7Connection test for &f%IP%&7: %RESULT% &8| &7Reason: &f%REASON%"
    allowed: "&aALLOWED"
    blocked: "&cBLOCKED"
    reason-none: "No enabled policy matched"
    reason-username: "Prohibited username term"
    reason-vpn: "VPN, proxy, Tor, or proxy blocklist"
    reason-isp: "Restricted ISP or ASN"
    reason-geo: "Restricted region"
    reason-runtime-whitelist: "Temporary IP whitelist"

messages:
  prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold> <dark_gray>|</dark_gray>"
  kick-prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold>"
  kick-contact: "&#35D3FFstore.example.net    &#6F7DFFdiscord.gg/invite"
  adaptive-sonar-attack-log: "Sonar detected a bot attack; Sonar will screen new connections before VPN checks."
  adaptive-sonar-local-attack-log: "Pre-Sonar blocks exceeded the configured threshold; Sonar will screen new connections before VPN checks."
  adaptive-sonar-recovery-log: "Sonar mitigated the attack; Sonar remains first during the recovery window."
  adaptive-sonar-normal-log: "Traffic remained stable; VPN checks are running before Sonar again."
  pre-sonar-check-failed: "{kick_prefix}\\n\\n&c&lConnection check unavailable\\n&7The required network security checks could not finish safely before verification.\\n\\n&8Reason: &fPre-verification check timed out or failed\\n&7Please wait briefly and reconnect. Contact support if the problem continues.\\n\\n{kick_contact}"
  username-block: "{kick_prefix}\\n\\n&c&lAccess denied\\n&7Your username contains a term prohibited by this server's naming policy.\\n\\n&8Reason: &fProhibited username term\\n&8Matched term: &f%MATCH%\\n\\n{kick_contact}"
  username-notify: "{prefix} &e%NAME% &7(%IP%) was blocked by the username filter. &8Match: &f%MATCH%"
  username-webhook: "%NAME% (%IP%) was blocked by the username filter. Match: %MATCH%."
  vpn-block: "{kick_prefix}\\n\\n&c&lAccess denied\\n&7Your connection was identified as a VPN, proxy, Tor exit node, or known anonymizer.\\n\\n&8Reason: &fUntrusted network connection\\n&7Disable the VPN or proxy and reconnect. Contact support if you believe this detection is incorrect.\\n\\n{kick_contact}"
  vpn-notify: "{prefix} &e%NAME% &7(%IP%) was blocked for VPN/proxy detection."
  vpn-webhook: "%NAME% (%IP%) tried to connect with a VPN/proxy."
  geo-block: "{kick_prefix}\\n\\n&c&lAccess denied\\n&7The detected location of your connection does not meet this server's regional access policy.\\n\\n&8Reason: &fRestricted region\\n&8Detected country: &f%COUNTRY%\\n&7Contact support if you believe the location is incorrect.\\n\\n{kick_contact}"
  geo-notify: "{prefix} &e%NAME% &7(%IP%) was blocked by geo rules. &8Location: &f%COUNTRY%&7, &f%CITY%"
  geo-webhook: "%NAME% (%IP%, %ISP%) tried to connect from %CITY%, %COUNTRY%."
  isp-block: "{kick_prefix}\\n\\n&c&lAccess denied\\n&7Your network provider or autonomous system number is restricted by this server's access policy.\\n\\n&8Reason: &fRestricted ISP or ASN\\n&8ISP: &f%ISP%\\n&8ASN: &f%ASN%\\n&7Contact support if you believe this restriction is incorrect.\\n\\n{kick_contact}"
  isp-notify: "{prefix} &e%NAME% &7(%IP%) was blocked by ISP/ASN rules. &8ISP: &f%ISP% &8ASN: &f%ASN% &8Match: &f%MATCH%"
  isp-webhook: "%NAME% (%IP%) was blocked by ISP/ASN rules. ISP: %ISP%, ASN: %ASN%, match: %MATCH%."
  help:
    - "{prefix} &7Commands"
    - " &8- &f/twiantivpn help &7Show this overview."
    - " &8- &f/twiantivpn reload &7Reload configuration and language files."
    - " &8- &f/twiantivpn clear &7[Player/UUID/IP] Clear cache entries."
    - " &8- &f/twiantivpn info &7<Player/UUID/IP> Show VPN and geo data."
    - " &8- &f/twiantivpn whitelist &7<IP> Temporarily bypass all checks for an IP."
    - " &8- &f/twiantivpn test &7<IP|attack [on|off]> Test decisions and adaptive routing."
  info:
    text:
      - "{prefix} &7Query result for &f%INPUT%"
      - "&7IP: &f%IP% &8| &7VPN: %IS_VPN%"
      - "&7Location: &f%CITY%&7, &f%COUNTRY%"
      - "&7ISP: &f%ISP%"
      - "&7ASN: &f%ASN%"
    is-vpn: "&cDetected"
    not-vpn: "&aClean"
