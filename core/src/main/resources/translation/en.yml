# TwiAntiVpn language file.
# {prefix} and %PREFIX% are resolved from messages.prefix.
command:
  no-permission: "{prefix} &cYou do not have permission to use this command."
  unknown-subcommand: "{prefix} &7Unknown subcommand. Use &f/twiantivpn help&7 to view available commands."
  config-reload: "{prefix} &aConfiguration and language files reloaded."
  clear:
    clear-all: "{prefix} &7All VPN and geo cache entries were cleared."
    clear-specific: "{prefix} &7Cache entries for &f%ENTRY%&7 were cleared."
  invalid-argument: "{prefix} &7Enter an online player, UUID, or valid IP address."

messages:
  prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold> <dark_gray>|</dark_gray>"
  username-block: "{prefix}\\n&cConnection blocked\\n&7Your username contains a term that is not allowed on this server.\\n\\n&8Match: &f%MATCH%"
  username-notify: "{prefix} &e%NAME% &7(%IP%) was blocked by the username filter. &8Match: &f%MATCH%"
  username-webhook: "%NAME% (%IP%) was blocked by the username filter. Match: %MATCH%."
  vpn-block: "{prefix}\\n&cConnection blocked\\n&7A VPN, proxy, Tor exit node, or listed anonymizer was detected on your connection.\\n\\n&7Disable it and try again. If this is a mistake, contact staff."
  vpn-notify: "{prefix} &e%NAME% &7(%IP%) was blocked for VPN/proxy detection."
  vpn-webhook: "%NAME% (%IP%) tried to connect with a VPN/proxy."
  geo-block: "{prefix}\\n&cConnection blocked\\n&7Connections from &f%COUNTRY%&7 are not allowed on this server.\\n\\n&7If this is a mistake, contact staff."
  geo-notify: "{prefix} &e%NAME% &7(%IP%) was blocked by geo rules. &8Location: &f%COUNTRY%&7, &f%CITY%"
  geo-webhook: "%NAME% (%IP%, %ISP%) tried to connect from %CITY%, %COUNTRY%."
  isp-block: "{prefix}\\n&cConnection blocked\\n&7Connections from your network provider are not allowed on this server.\\n\\n&8ISP: &f%ISP% &8| ASN: &f%ASN%"
  isp-notify: "{prefix} &e%NAME% &7(%IP%) was blocked by ISP/ASN rules. &8ISP: &f%ISP% &8ASN: &f%ASN% &8Match: &f%MATCH%"
  isp-webhook: "%NAME% (%IP%) was blocked by ISP/ASN rules. ISP: %ISP%, ASN: %ASN%, match: %MATCH%."
  help:
    - "{prefix} &7Commands"
    - " &8- &f/twiantivpn help &7Show this overview."
    - " &8- &f/twiantivpn reload &7Reload configuration and language files."
    - " &8- &f/twiantivpn clear &7[Player/UUID/IP] Clear cache entries."
    - " &8- &f/twiantivpn info &7<Player/UUID/IP> Show VPN and geo data."
  info:
    text:
      - "{prefix} &7Query result for &f%INPUT%"
      - "&7IP: &f%IP% &8| &7VPN: %IS_VPN%"
      - "&7Location: &f%CITY%&7, &f%COUNTRY%"
      - "&7ISP: &f%ISP%"
      - "&7ASN: &f%ASN%"
    is-vpn: "&cDetected"
    not-vpn: "&aClean"
