# Archivo de idioma de TwiAntiVpn.
# {prefix}, {kick_prefix} y {kick_contact} se resuelven desde sus entradas en messages.
command:
  no-permission: "{prefix} &cNo tienes permiso para usar este comando."
  unknown-subcommand: "{prefix} &7Subcomando desconocido. Usa &f/twiantivpn help&7 para ver los comandos disponibles."
  config-reload: "{prefix} &aLa configuracion y los archivos de idioma se recargaron."
  clear:
    clear-all: "{prefix} &7Se limpiaron todas las entradas de cache VPN y geo."
    clear-specific: "{prefix} &7Se limpiaron las entradas de cache de &f%ENTRY%&7."
  whitelist:
    added: "{prefix} &f%IP% &7se añadió a la lista blanca temporal hasta que se reinicie el servidor."
    already-added: "{prefix} &f%IP% &7ya está en la lista blanca temporal."
    invalid-ip: "{prefix} &7Introduce una dirección IPv4 o IPv6 válida."
  invalid-argument: "{prefix} &7Introduce un jugador conectado, UUID o direccion IP valida."
  test:
    busy: "{prefix} &eYa hay una prueba de conexión en curso. Espera a que termine."
    failed: "{prefix} &cLa prueba de conexión falló de forma segura. Revisa error.log para ver los detalles."
    attack-status: "{prefix} &7Modo de enrutamiento: &f%MODE% &8| &7Antes: &f%BEFORE% &8| &7Después: &f%AFTER%"
    sonar-first: "Sonar primero"
    antivpn-first: "TwiAntiVpn primero"
    connection-result: "{prefix} &7Prueba de conexión para &f%IP%&7: %RESULT% &8| &7Motivo: &f%REASON%"
    allowed: "&aPERMITIDA"
    blocked: "&cBLOQUEADA"
    reason-none: "No coincide con ninguna política activa"
    reason-username: "Término de usuario prohibido"
    reason-vpn: "VPN, proxy, Tor o lista negra de proxies"
    reason-isp: "ISP o ASN restringido"
    reason-geo: "Región restringida"
    reason-runtime-whitelist: "Lista blanca temporal de IP"

messages:
  prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold> <dark_gray>|</dark_gray>"
  kick-prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold>"
  kick-contact: "&#35D3FFstore.example.net    &#6F7DFFdiscord.gg/invite"
  adaptive-sonar-attack-log: "Sonar detectó un ataque de bots; Sonar filtrará las conexiones nuevas antes de las comprobaciones de VPN."
  adaptive-sonar-local-attack-log: "Los bloqueos antes de Sonar superaron el umbral configurado; Sonar filtrará las conexiones nuevas antes de las comprobaciones de VPN."
  adaptive-sonar-recovery-log: "Sonar mitigó el ataque; Sonar permanecerá primero durante el periodo de recuperación."
  adaptive-sonar-normal-log: "El tráfico se mantuvo estable; las comprobaciones de VPN vuelven a ejecutarse antes de Sonar."
  pre-sonar-check-failed: "{kick_prefix}\\n\\n&c&lComprobación de conexión no disponible\\n&7Las comprobaciones de seguridad de red obligatorias no pudieron finalizar de forma segura antes de la verificación.\\n\\n&8Motivo: &fLa comprobación previa agotó el tiempo o falló\\n&7Espera un momento y vuelve a conectarte. Contacta con soporte si el problema continúa.\\n\\n{kick_contact}"
  username-block: "{kick_prefix}\\n\\n&c&lAcceso denegado\\n&7Tu nombre de usuario contiene un término prohibido por la política de nombres del servidor.\\n\\n&8Motivo: &fTérmino de usuario prohibido\\n&8Término detectado: &f%MATCH%\\n\\n{kick_contact}"
  username-notify: "{prefix} &e%NAME% &7(%IP%) fue bloqueado por el filtro de nombres. &8Coincidencia: &f%MATCH%"
  username-webhook: "%NAME% (%IP%) fue bloqueado por el filtro de nombres. Coincidencia: %MATCH%."
  vpn-block: "{kick_prefix}\\n\\n&c&lAcceso denegado\\n&7Tu conexión fue identificada como VPN, proxy, nodo de salida Tor o anonimizador conocido.\\n\\n&8Motivo: &fConexión de red no confiable\\n&7Desactiva la VPN o el proxy y vuelve a conectarte. Contacta con soporte si crees que la detección es incorrecta.\\n\\n{kick_contact}"
  vpn-notify: "{prefix} &e%NAME% &7(%IP%) fue bloqueado por deteccion de VPN/proxy."
  vpn-webhook: "%NAME% (%IP%) intento conectarse con VPN/proxy."
  geo-block: "{kick_prefix}\\n\\n&c&lAcceso denegado\\n&7La ubicación detectada de tu conexión no cumple la política de acceso regional del servidor.\\n\\n&8Motivo: &fRegión restringida\\n&8País detectado: &f%COUNTRY%\\n&7Contacta con soporte si crees que la ubicación es incorrecta.\\n\\n{kick_contact}"
  geo-notify: "{prefix} &e%NAME% &7(%IP%) fue bloqueado por reglas geo. &8Ubicacion: &f%COUNTRY%&7, &f%CITY%"
  geo-webhook: "%NAME% (%IP%, %ISP%) intento conectarse desde %CITY%, %COUNTRY%."
  isp-block: "{kick_prefix}\\n\\n&c&lAcceso denegado\\n&7Tu proveedor de red o número de sistema autónomo está restringido por la política de acceso del servidor.\\n\\n&8Motivo: &fISP o ASN restringido\\n&8ISP: &f%ISP%\\n&8ASN: &f%ASN%\\n&7Contacta con soporte si crees que esta restricción es incorrecta.\\n\\n{kick_contact}"
  isp-notify: "{prefix} &e%NAME% &7(%IP%) fue bloqueado por reglas ISP/ASN. &8ISP: &f%ISP% &8ASN: &f%ASN% &8Coincidencia: &f%MATCH%"
  isp-webhook: "%NAME% (%IP%) fue bloqueado por reglas ISP/ASN. ISP: %ISP%, ASN: %ASN%, coincidencia: %MATCH%."
  help:
    - "{prefix} &7Comandos"
    - " &8- &f/twiantivpn help &7Muestra esta lista."
    - " &8- &f/twiantivpn reload &7Recarga configuracion e idiomas."
    - " &8- &f/twiantivpn clear &7[Jugador/UUID/IP] Limpia entradas de cache."
    - " &8- &f/twiantivpn info &7<Jugador/UUID/IP> Muestra datos VPN y geo."
    - " &8- &f/twiantivpn whitelist &7<IP> Omite temporalmente todos los controles para una IP."
    - " &8- &f/twiantivpn test &7<IP|attack [on|off]> Prueba decisiones y enrutamiento adaptativo."
  info:
    text:
      - "{prefix} &7Resultado para &f%INPUT%"
      - "&7IP: &f%IP% &8| &7VPN: %IS_VPN%"
      - "&7Ubicacion: &f%CITY%&7, &f%COUNTRY%"
      - "&7ISP: &f%ISP%"
      - "&7ASN: &f%ASN%"
    is-vpn: "&cDetectado"
    not-vpn: "&aLimpio"
