# TwiAntiVpn dil faylı.
# {prefix} və %PREFIX% messages.prefix sahəsindən götürülür.
command:
  no-permission: "{prefix} &cBu əmrdən istifadə etmək üçün icazən yoxdur."
  unknown-subcommand: "{prefix} &7Naməlum alt əmr. Əmrləri görmək üçün &f/twiantivpn help&7 yaz."
  config-reload: "{prefix} &aKonfiqurasiya və dil faylları yenidən yükləndi."
  clear:
    clear-all: "{prefix} &7Bütün VPN və geo keş qeydləri təmizləndi."
    clear-specific: "{prefix} &f%ENTRY% &7üçün keş qeydləri təmizləndi."
  invalid-argument: "{prefix} &7Onlayn oyunçu, UUID və ya etibarlı IP ünvanı daxil et."

messages:
  prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold> <dark_gray>|</dark_gray>"
  username-block: "{prefix}\\n&cBağlantı bloklandı\\n&7İstifadəçi adın bu serverdə icazə verilməyən ifadə ehtiva edir.\\n\\n&8Uyğunluq: &f%MATCH%"
  username-notify: "{prefix} &e%NAME% &7(%IP%) istifadəçi adı filtrinə görə bloklandı. &8Uyğunluq: &f%MATCH%"
  username-webhook: "%NAME% (%IP%) istifadəçi adı filtrinə görə bloklandı. Uyğunluq: %MATCH%."
  vpn-block: "{prefix}\\n&cBağlantı bloklandı\\n&7Bağlantında VPN, proxy, Tor çıxış nöqtəsi və ya siyahıya alınmış anonimləşdirici aşkarlandı.\\n\\n&7Onu söndürüb yenidən yoxla. Bunun səhv olduğunu düşünürsənsə, heyətlə əlaqə saxla."
  vpn-notify: "{prefix} &e%NAME% &7(%IP%) VPN/proxy aşkarlanmasına görə bloklandı."
  vpn-webhook: "%NAME% (%IP%) VPN/proxy ilə qoşulmağa çalışdı."
  geo-block: "{prefix}\\n&cBağlantı bloklandı\\n&f%COUNTRY% &7məkanından bağlantılara bu serverdə icazə verilmir.\\n\\n&7Bunun səhv olduğunu düşünürsənsə, heyətlə əlaqə saxla."
  geo-notify: "{prefix} &e%NAME% &7(%IP%) geo qaydalarına görə bloklandı. &8Məkan: &f%COUNTRY%&7, &f%CITY%"
  geo-webhook: "%NAME% (%IP%, %ISP%) %CITY%, %COUNTRY% məkanından qoşulmağa çalışdı."
  isp-block: "{prefix}\\n&cBağlantı bloklandı\\n&7Şəbəkə provayderin üzərindən bağlantılara bu serverdə icazə verilmir.\\n\\n&8ISP: &f%ISP% &8| ASN: &f%ASN%"
  isp-notify: "{prefix} &e%NAME% &7(%IP%) ISP/ASN qaydalarına görə bloklandı. &8ISP: &f%ISP% &8ASN: &f%ASN% &8Uyğunluq: &f%MATCH%"
  isp-webhook: "%NAME% (%IP%) ISP/ASN qaydalarına görə bloklandı. ISP: %ISP%, ASN: %ASN%, uyğunluq: %MATCH%."
  help:
    - "{prefix} &7Əmrlər"
    - " &8- &f/twiantivpn help &7Bu siyahını göstərir."
    - " &8- &f/twiantivpn reload &7Konfiqurasiya və dil fayllarını yeniləyir."
    - " &8- &f/twiantivpn clear &7[Oyunçu/UUID/IP] Keş qeydlərini təmizləyir."
    - " &8- &f/twiantivpn info &7<Oyunçu/UUID/IP> VPN və geo məlumatlarını göstərir."
  info:
    text:
      - "{prefix} &f%INPUT% &7üçün sorğu nəticəsi"
      - "&7IP: &f%IP% &8| &7VPN: %IS_VPN%"
      - "&7Məkan: &f%CITY%&7, &f%COUNTRY%"
      - "&7ISP: &f%ISP%"
      - "&7ASN: &f%ASN%"
    is-vpn: "&cAşkarlandı"
    not-vpn: "&aTəmiz"
