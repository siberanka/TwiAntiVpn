# TwiAntiVpn dil faylı.
# {prefix}, {kick_prefix} və {kick_contact} müvafiq messages sahələrindən götürülür.
command:
  no-permission: "{prefix} &cBu əmrdən istifadə etmək üçün icazən yoxdur."
  unknown-subcommand: "{prefix} &7Naməlum alt əmr. Əmrləri görmək üçün &f/twiantivpn help&7 yaz."
  config-reload: "{prefix} &aKonfiqurasiya və dil faylları yenidən yükləndi."
  clear:
    clear-all: "{prefix} &7Bütün VPN və geo keş qeydləri təmizləndi."
    clear-specific: "{prefix} &f%ENTRY% &7üçün keş qeydləri təmizləndi."
  invalid-argument: "{prefix} &7Onlayn oyunçu, UUID və ya etibarlı IP ünvanı daxil et."
  test:
    busy: "{prefix} &eBağlantı testi artıq işləyir. Tamamlanmasını gözlə."
    failed: "{prefix} &cBağlantı testi təhlükəsiz şəkildə uğursuz oldu. Ətraflı məlumat üçün error.log faylına bax."
    attack-status: "{prefix} &7Yönləndirmə rejimi: &f%MODE% &8| &7Əvvəl: &f%BEFORE% &8| &7Sonra: &f%AFTER%"
    sonar-first: "Əvvəl Sonar"
    antivpn-first: "Əvvəl TwiAntiVpn"
    connection-result: "{prefix} &f%IP% &7bağlantı testi: %RESULT% &8| &7Səbəb: &f%REASON%"
    allowed: "&aİCAZƏ VERİLİR"
    blocked: "&cBLOKLANIR"
    reason-none: "Aktiv siyasətlərlə uyğunlaşmadı"
    reason-username: "Qadağan olunmuş istifadəçi adı ifadəsi"
    reason-vpn: "VPN, proxy, Tor və ya proxy qara siyahısı"
    reason-isp: "Məhdudlaşdırılmış ISP və ya ASN"
    reason-geo: "Məhdudlaşdırılmış bölgə"

messages:
  prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold> <dark_gray>|</dark_gray>"
  kick-prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold>"
  kick-contact: "&#35D3FFstore.example.net    &#6F7DFFdiscord.gg/invite"
  adaptive-sonar-attack-log: "Sonar bot hücumu aşkar etdi; yeni bağlantılar VPN yoxlamasından əvvəl Sonar tərəfindən yoxlanılacaq."
  adaptive-sonar-local-attack-log: "Sonar öncəsi bloklamalar təyin edilmiş həddi keçdi; yeni bağlantılar VPN yoxlamasından əvvəl Sonar tərəfindən yoxlanılacaq."
  adaptive-sonar-recovery-log: "Sonar hücumu zərərsizləşdirdi; bərpa müddətində Sonar birinci qalacaq."
  adaptive-sonar-normal-log: "Trafik sabit qaldı; VPN yoxlamaları yenidən Sonar-dan əvvəl işləyir."
  pre-sonar-check-failed: "{kick_prefix}\\n\\n&c&lBağlantı yoxlaması əlçatan deyil\\n&7Tələb olunan şəbəkə təhlükəsizliyi yoxlamaları doğrulamadan əvvəl təhlükəsiz şəkildə tamamlana bilmədi.\\n\\n&8Səbəb: &fİlkin doğrulama yoxlamasının vaxtı bitdi və ya yoxlama uğursuz oldu\\n&7Qısa müddət gözləyib yenidən qoşulun. Problem davam edərsə dəstək xidməti ilə əlaqə saxlayın.\\n\\n{kick_contact}"
  username-block: "{kick_prefix}\\n\\n&c&lGiriş rədd edildi\\n&7İstifadəçi adında serverin adlandırma qaydaları ilə qadağan olunmuş ifadə var.\\n\\n&8Səbəb: &fQadağan olunmuş istifadəçi adı ifadəsi\\n&8Uyğun gələn ifadə: &f%MATCH%\\n\\n{kick_contact}"
  username-notify: "{prefix} &e%NAME% &7(%IP%) istifadəçi adı filtrinə görə bloklandı. &8Uyğunluq: &f%MATCH%"
  username-webhook: "%NAME% (%IP%) istifadəçi adı filtrinə görə bloklandı. Uyğunluq: %MATCH%."
  vpn-block: "{kick_prefix}\\n\\n&c&lGiriş rədd edildi\\n&7Bağlantın VPN, proxy, Tor çıxış nöqtəsi və ya məlum anonimləşdirici kimi aşkarlandı.\\n\\n&8Səbəb: &fEtibarsız şəbəkə bağlantısı\\n&7VPN və ya proxy xidmətini söndürüb yenidən qoşul. Aşkarlamanın səhv olduğunu düşünürsənsə, dəstək komandası ilə əlaqə saxla.\\n\\n{kick_contact}"
  vpn-notify: "{prefix} &e%NAME% &7(%IP%) VPN/proxy aşkarlanmasına görə bloklandı."
  vpn-webhook: "%NAME% (%IP%) VPN/proxy ilə qoşulmağa çalışdı."
  geo-block: "{kick_prefix}\\n\\n&c&lGiriş rədd edildi\\n&7Bağlantının aşkar edilən məkanı serverin regional giriş qaydalarına uyğun deyil.\\n\\n&8Səbəb: &fMəhdudlaşdırılmış region\\n&8Aşkar edilən ölkə: &f%COUNTRY%\\n&7Məkan məlumatının səhv olduğunu düşünürsənsə, dəstək komandası ilə əlaqə saxla.\\n\\n{kick_contact}"
  geo-notify: "{prefix} &e%NAME% &7(%IP%) geo qaydalarına görə bloklandı. &8Məkan: &f%COUNTRY%&7, &f%CITY%"
  geo-webhook: "%NAME% (%IP%, %ISP%) %CITY%, %COUNTRY% məkanından qoşulmağa çalışdı."
  isp-block: "{kick_prefix}\\n\\n&c&lGiriş rədd edildi\\n&7Şəbəkə provayderin və ya avtonom sistem nömrən serverin giriş qaydaları ilə məhdudlaşdırılıb.\\n\\n&8Səbəb: &fMəhdudlaşdırılmış ISP və ya ASN\\n&8ISP: &f%ISP%\\n&8ASN: &f%ASN%\\n&7Bunun səhv olduğunu düşünürsənsə, dəstək komandası ilə əlaqə saxla.\\n\\n{kick_contact}"
  isp-notify: "{prefix} &e%NAME% &7(%IP%) ISP/ASN qaydalarına görə bloklandı. &8ISP: &f%ISP% &8ASN: &f%ASN% &8Uyğunluq: &f%MATCH%"
  isp-webhook: "%NAME% (%IP%) ISP/ASN qaydalarına görə bloklandı. ISP: %ISP%, ASN: %ASN%, uyğunluq: %MATCH%."
  help:
    - "{prefix} &7Əmrlər"
    - " &8- &f/twiantivpn help &7Bu siyahını göstərir."
    - " &8- &f/twiantivpn reload &7Konfiqurasiya və dil fayllarını yeniləyir."
    - " &8- &f/twiantivpn clear &7[Oyunçu/UUID/IP] Keş qeydlərini təmizləyir."
    - " &8- &f/twiantivpn info &7<Oyunçu/UUID/IP> VPN və geo məlumatlarını göstərir."
    - " &8- &f/twiantivpn test &7<IP|attack [on|off]> Qərarı və adaptive yönləndirməni yoxlayır."
  info:
    text:
      - "{prefix} &f%INPUT% &7üçün sorğu nəticəsi"
      - "&7IP: &f%IP% &8| &7VPN: %IS_VPN%"
      - "&7Məkan: &f%CITY%&7, &f%COUNTRY%"
      - "&7ISP: &f%ISP%"
      - "&7ASN: &f%ASN%"
    is-vpn: "&cAşkarlandı"
    not-vpn: "&aTəmiz"
