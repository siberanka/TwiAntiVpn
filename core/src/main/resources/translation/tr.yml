# TwiAntiVpn dil dosyası.
# {prefix}, {kick_prefix} ve {kick_contact} ilgili messages alanlarından çözülür.
command:
  no-permission: "{prefix} &cBu komutu kullanmak için yetkin yok."
  unknown-subcommand: "{prefix} &7Bilinmeyen alt komut. Komutları görmek için &f/twiantivpn help&7 yaz."
  config-reload: "{prefix} &aYapılandırma ve dil dosyaları yeniden yüklendi."
  clear:
    clear-all: "{prefix} &7Tüm VPN ve geo önbellek kayıtları temizlendi."
    clear-specific: "{prefix} &f%ENTRY% &7için önbellek kayıtları temizlendi."
  invalid-argument: "{prefix} &7Çevrimiçi oyuncu, UUID veya geçerli bir IP adresi gir."
  test:
    busy: "{prefix} &eBir bağlantı testi zaten çalışıyor. Tamamlanmasını bekle."
    failed: "{prefix} &cBağlantı testi güvenli biçimde başarısız oldu. Ayrıntılar için error.log dosyasını incele."
    attack-status: "{prefix} &7Yönlendirme modu: &f%MODE% &8| &7Önce: &f%BEFORE% &8| &7Sonra: &f%AFTER%"
    sonar-first: "Önce Sonar"
    antivpn-first: "Önce TwiAntiVpn"
    connection-result: "{prefix} &f%IP% &7bağlantı testi: %RESULT% &8| &7Neden: &f%REASON%"
    allowed: "&aİZİN VERİLİR"
    blocked: "&cENGELLENİR"
    reason-none: "Aktif politikalarla eşleşmedi"
    reason-username: "Yasaklı kullanıcı adı ifadesi"
    reason-vpn: "VPN, proxy, Tor veya proxy kara listesi"
    reason-isp: "Kısıtlı ISP veya ASN"
    reason-geo: "Kısıtlı bölge"

messages:
  prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold> <dark_gray>|</dark_gray>"
  kick-prefix: "<bold><gradient:#35d3ff:#6f7dff>TwiAntiVpn</gradient></bold>"
  kick-contact: "&#35D3FFstore.example.net    &#6F7DFFdiscord.gg/invite"
  adaptive-sonar-attack-log: "Sonar bir bot saldırısı tespit etti; yeni bağlantılar VPN kontrolünden önce Sonar tarafından taranacak."
  adaptive-sonar-local-attack-log: "Sonar öncesi engellemeler yapılandırılan eşiği aştı; yeni bağlantılar VPN kontrolünden önce Sonar tarafından taranacak."
  adaptive-sonar-recovery-log: "Sonar saldırıyı etkisiz hâle getirdi; toparlanma süresince Sonar öncelikli kalacak."
  adaptive-sonar-normal-log: "Trafik kararlı kaldı; VPN kontrolleri yeniden Sonar'dan önce çalışıyor."
  pre-sonar-check-failed: "{kick_prefix}\\n\\n&c&lBağlantı kontrolü kullanılamıyor\\n&7Zorunlu ağ güvenliği kontrolleri doğrulama öncesinde güvenli biçimde tamamlanamadı.\\n\\n&8Neden: &fÖn doğrulama kontrolü zaman aşımına uğradı veya başarısız oldu\\n&7Lütfen kısa bir süre bekleyip yeniden bağlanın. Sorun sürerse destek ekibiyle iletişime geçin.\\n\\n{kick_contact}"
  username-block: "{kick_prefix}\\n\\n&c&lGiriş reddedildi\\n&7Kullanıcı adın sunucunun adlandırma politikasında yasaklanan bir ifade içeriyor.\\n\\n&8Neden: &fYasaklı kullanıcı adı ifadesi\\n&8Eşleşen ifade: &f%MATCH%\\n\\n{kick_contact}"
  username-notify: "{prefix} &e%NAME% &7(%IP%) kullanıcı adı filtresiyle engellendi. &8Eşleşme: &f%MATCH%"
  username-webhook: "%NAME% (%IP%) kullanıcı adı filtresiyle engellendi. Eşleşme: %MATCH%."
  vpn-block: "{kick_prefix}\\n\\n&c&lGiriş reddedildi\\n&7Bağlantın VPN, proxy, Tor çıkış düğümü veya bilinen bir anonimleştirici olarak tespit edildi.\\n\\n&8Neden: &fGüvenilmeyen ağ bağlantısı\\n&7VPN veya proxy hizmetini kapatıp yeniden bağlan. Tespitin hatalı olduğunu düşünüyorsan destek ekibine ulaş.\\n\\n{kick_contact}"
  vpn-notify: "{prefix} &e%NAME% &7(%IP%) VPN/proxy tespiti nedeniyle engellendi."
  vpn-webhook: "%NAME% (%IP%) VPN/proxy ile bağlanmayı denedi."
  geo-block: "{kick_prefix}\\n\\n&c&lGiriş reddedildi\\n&7Bağlantının tespit edilen konumu sunucunun bölgesel erişim politikasına uygun değil.\\n\\n&8Neden: &fKısıtlanmış bölge\\n&8Tespit edilen ülke: &f%COUNTRY%\\n&7Konum bilgisinin hatalı olduğunu düşünüyorsan destek ekibine ulaş.\\n\\n{kick_contact}"
  geo-notify: "{prefix} &e%NAME% &7(%IP%) geo kuralları nedeniyle engellendi. &8Konum: &f%COUNTRY%&7, &f%CITY%"
  geo-webhook: "%NAME% (%IP%, %ISP%) %CITY%, %COUNTRY% konumundan bağlanmayı denedi."
  isp-block: "{kick_prefix}\\n\\n&c&lGiriş reddedildi\\n&7Ağ sağlayıcın veya otonom sistem numaran sunucunun erişim politikasında engellenmiş durumda.\\n\\n&8Neden: &fKısıtlanmış ISP veya ASN\\n&8ISP: &f%ISP%\\n&8ASN: &f%ASN%\\n&7Bunun bir hata olduğunu düşünüyorsan destek ekibine ulaş.\\n\\n{kick_contact}"
  isp-notify: "{prefix} &e%NAME% &7(%IP%) ISP/ASN kurallarıyla engellendi. &8ISP: &f%ISP% &8ASN: &f%ASN% &8Eşleşme: &f%MATCH%"
  isp-webhook: "%NAME% (%IP%) ISP/ASN kurallarıyla engellendi. ISP: %ISP%, ASN: %ASN%, eşleşme: %MATCH%."
  help:
    - "{prefix} &7Komutlar"
    - " &8- &f/twiantivpn help &7Bu listeyi gösterir."
    - " &8- &f/twiantivpn reload &7Yapılandırma ve dil dosyalarını yeniler."
    - " &8- &f/twiantivpn clear &7[Oyuncu/UUID/IP] Önbellek kayıtlarını temizler."
    - " &8- &f/twiantivpn info &7<Oyuncu/UUID/IP> VPN ve geo bilgilerini gösterir."
    - " &8- &f/twiantivpn test &7<IP|attack [on|off]> Kararı ve adaptive yönlendirmeyi test eder."
  info:
    text:
      - "{prefix} &f%INPUT% &7için sorgu sonucu"
      - "&7IP: &f%IP% &8| &7VPN: %IS_VPN%"
      - "&7Konum: &f%CITY%&7, &f%COUNTRY%"
      - "&7ISP: &f%ISP%"
      - "&7ASN: &f%ASN%"
    is-vpn: "&cTespit edildi"
    not-vpn: "&aTemiz"
