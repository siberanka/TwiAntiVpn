name: TwiAntiVpn
version: '${version}'
authors:
  - gerolndnr
  - siberanka
website: https://gitlab.com/siberanka
main: com.siberanka.twiantivpn.spigot.ConnectionGuardSpigotPlugin
api-version: 1.13
folia-supported: true
softdepend:
  - LuckPerms
  - Sonar
  - SonarBukkit
  - SonarSpigot
  - SonarPaper
  - SonarBukkitPlugin
  - Asteroid
  - AsteroidProxy
  - AsteroidSpoofer
  - AsteroidLibs
commands:
  twiantivpn:
    name: twiantivpn
    description: Retrieve TwiAntiVpn connection security information ingame.
    permission: twiantivpn.command
    aliases:
      - twiavpn
      - tavpn
      - antivpn
permissions:
  twiantivpn.command:
    description: Allows access to the TwiAntiVpn command root.
    default: op
  twiantivpn.command.help:
    description: Allows viewing TwiAntiVpn help.
    default: op
  twiantivpn.command.reload:
    description: Allows reloading TwiAntiVpn.
    default: op
  twiantivpn.command.clear:
    description: Allows clearing TwiAntiVpn cache.
    default: op
  twiantivpn.command.info:
    description: Allows querying TwiAntiVpn information.
    default: op
  twiantivpn.command.test:
    description: Allows testing TwiAntiVpn routing and connection decisions.
    default: op
  twiantivpn.notify.vpn:
    description: Receives TwiAntiVpn VPN notifications.
    default: op
  twiantivpn.notify.geo:
    description: Receives TwiAntiVpn geo notifications.
    default: op
  twiantivpn.notify.username:
    description: Receives TwiAntiVpn username filter notifications.
    default: op
  twiantivpn.notify.isp:
    description: Receives TwiAntiVpn ISP/ASN notifications.
    default: op
  twiantivpn.exemption.vpn:
    description: Exempts a player from TwiAntiVpn VPN checks when permission exemptions are enabled.
    default: false
  twiantivpn.exemption.geo:
    description: Exempts a player from TwiAntiVpn geo checks when permission exemptions are enabled.
    default: false
